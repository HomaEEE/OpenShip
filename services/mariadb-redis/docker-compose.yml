services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.4}
    container_name: mariadb
    restart: unless-stopped
    command:
      - --default-storage-engine=InnoDB
      - --innodb-buffer-pool-size=${MARIADB_BUFFER_POOL_SIZE:-256M}
      - --innodb-buffer-pool-instances=1
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --innodb-io-capacity=2000
      - --innodb-io-capacity-max=4000
      - --performance-schema=OFF
      - --skip-name-resolve=1
      - --max-connections=${MARIADB_MAX_CONNECTIONS:-30}
      - --max-connect-errors=10000
      - --thread-cache-size=16
      - --wait-timeout=600
      - --interactive-timeout=600
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${MARIADB_ROOT_PASSWORD}}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
    mem_limit: ${MARIADB_MEMORY_LIMIT:-512m}
    cpus: "0.50"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --requirepass "$${REDIS_PASSWORD}" --maxmemory ${REDIS_MAXMEMORY:-48mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
        else
          exec redis-server --maxmemory ${REDIS_MAXMEMORY:-48mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEMORY_LIMIT:-80m}
    cpus: "0.25"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 30s
      timeout: 3s
      retries: 5

  phpmyadmin:
    image: dunglas/frankenphp:1-php${PHP_VERSION:-8.4}-bookworm
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ${PHPMYADMIN_HOST:-mariadb}
      PMA_PORT: ${MARIADB_PORT:-3306}
      PMA_VERSION: ${PHPMYADMIN_VERSION:-latest}
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-512M}
      MEMORY_LIMIT: ${PHPMYADMIN_MEMORY_LIMIT:-128M}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${MARIADB_ROOT_PASSWORD:-}}
      PMA_ABSOLUTE_URI: ${PHPMYADMIN_DOMAIN:+https://${PHPMYADMIN_DOMAIN}/}
    ports:
      - "80"
    volumes:
      - pma_data:/app/public
    command:
      - sh
      - -c
      - |
        set -e
        if ! php -m | grep -qi '^mysqli$$'; then
          install-php-extensions mysqli
        fi
        INSTALLED_VER=""
        if [ -f /app/public/.pma-version ]; then
          INSTALLED_VER="$$(cat /app/public/.pma-version 2>/dev/null || true)"
        fi
        if [ ! -f /app/public/index.php ] || [ "$${INSTALLED_VER}" != "$${PMA_VERSION}" ]; then
          if [ "$${PMA_VERSION}" = "latest" ]; then
            PMA_URL="https://www.phpmyadmin.net/downloads/phpMyAdmin-latest-all-languages.tar.gz"
          else
            PMA_URL="https://files.phpmyadmin.net/phpMyAdmin/$${PMA_VERSION}/phpMyAdmin-$${PMA_VERSION}-all-languages.tar.gz"
          fi
          mkdir -p /app/public
          curl -fsSL "$${PMA_URL}" -o /tmp/pma.tar.gz
          find /app/public -mindepth 1 -delete
          tar -xzf /tmp/pma.tar.gz -C /app/public --strip-components=1
          rm -f /tmp/pma.tar.gz
          printf '%s' "$${PMA_VERSION}" > /app/public/.pma-version
        fi
        cat > /app/public/config.inc.php <<'EOF'
        <?php
        $cfg['blowfish_secret'] = hash('sha256', getenv('MARIADB_ROOT_PASSWORD') ?: 'openship_pma_secret');
        $i = 0;
        $i++;
        $cfg['Servers'][$i]['auth_type'] = 'cookie';
        $cfg['Servers'][$i]['host'] = getenv('PMA_HOST') ?: 'mariadb';
        $cfg['Servers'][$i]['port'] = (int)(getenv('PMA_PORT') ?: 3306);
        $cfg['Servers'][$i]['compress'] = false;
        $cfg['Servers'][$i]['AllowNoPassword'] = false;
        $cfg['TempDir'] = '/tmp';
        EOF
        {
          echo "upload_max_filesize = $${UPLOAD_LIMIT}"
          echo "post_max_size = $${UPLOAD_LIMIT}"
          echo "memory_limit = $${MEMORY_LIMIT}"
        } > /usr/local/etc/php/conf.d/pma.ini
        exec frankenphp php-server --listen :80 --root /app/public
    depends_on:
      mariadb:
        condition: service_healthy
    mem_limit: ${PHPMYADMIN_MEMORY_LIMIT:-128m}
    cpus: "0.50"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mariadb_data:
  redis_data:
  pma_data:
