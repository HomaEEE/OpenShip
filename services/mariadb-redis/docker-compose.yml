services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    command:
      - --default-storage-engine=InnoDB
      - --innodb-buffer-pool-size=${MARIADB_BUFFER_POOL_SIZE:-256M}
      - --innodb-buffer-pool-instances=1
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --innodb-io-capacity=2000
      - --innodb-io-capacity-max=4000
      - --performance-schema=OFF
      - --skip-name-resolve=1
      - --max-connections=30
      - --max-connect-errors=10000
      - --thread-cache-size=16
      - --wait-timeout=600
      - --interactive-timeout=600
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${MARIADB_ROOT_PASSWORD}}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      openship:
        ipv4_address: ${MARIADB_STATIC_IP:-172.20.0.10}
    mem_limit: 512m
    cpus: "0.50"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --requirepass "$${REDIS_PASSWORD}" --maxmemory 48mb --maxmemory-policy allkeys-lru
        else
          exec redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      openship:
        ipv4_address: ${REDIS_STATIC_IP:-172.20.0.11}
    mem_limit: 80m
    cpus: "0.25"

    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 30s
      timeout: 3s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:${PHPMYADMIN_VERSION:-latest}
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: ${PHPMYADMIN_HOST:-mariadb}
      PMA_PORT: ${MARIADB_PORT:-3306}
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-512M}
      MEMORY_LIMIT: ${PHPMYADMIN_MEMORY_LIMIT:-128M}
      MAX_EXECUTION_TIME: 600

    ports:
      - "${PHPMYADMIN_BIND_IP:-127.0.0.1}:${PHPMYADMIN_PORT:-20003}:80"
    networks:
      openship:
        ipv4_address: ${PHPMYADMIN_STATIC_IP:-172.20.0.12}
    depends_on:
      mariadb:
        condition: service_healthy

    mem_limit: 128m
    cpus: "0.50"

volumes:
  mariadb_data:
  redis_data:

networks:
  openship:
    name: ${OPENSHIP_NETWORK:-openship-mariadb}
    external: true
